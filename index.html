<title>alone — zozomargiela</title>
<style>
:root {
  --site-primary: #171717;
  --site-secondary: #080808;
  --site-background: #000000;
  --site-on-primary: #f4f4f4;
  --site-on-secondary: #a5a5a5;
  --site-on-background: #f4f4f4;
  --site-font-body: Arial, Helvetica, sans-serif;
  --site-font-heading: Arial, Helvetica, sans-serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #000; }
body { color: var(--site-on-background); font-family: var(--site-font-body); }
#app {
  min-height: 100vh;
  width: 100%;
  border-radius: 0;
  background-color: var(--site-background);
  color: var(--site-on-background);
  display: flex;
  flex-direction: column;
  padding: clamp(22px, 4vw, 54px);
}
header { display:flex; justify-content:space-between; align-items:center; color:#777; font-size:10px; letter-spacing:.22em; text-transform:uppercase; }
main { width:min(390px, 100%); margin:auto; padding: 56px 0 72px; }
.cover { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#111; }
.track { padding-top:28px; }
.title { font-family:var(--site-font-heading); font-size:calc(30px * var(--site-heading-scale)); font-weight:500; letter-spacing:-.055em; margin:0 0 22px; }
.controls { display:flex; align-items:center; gap:16px; }
button { width:46px; height:46px; border:1px solid #555; border-radius:50%; background:transparent; color:#fff; display:grid; place-items:center; cursor:pointer; flex:0 0 auto; transition:background .2s,border-color .2s; }
button:hover { background:#1b1b1b; border-color:#aaa; }
button:focus-visible, input:focus-visible { outline:2px solid #fff; outline-offset:4px; }
button svg { width:15px; height:15px; fill:currentColor; }
seek-wrap { display:block; flex:1; min-width:0; }
input[type=range] { appearance:none; width:100%; height:2px; display:block; background:#454545; cursor:pointer; }
input[type=range]::-webkit-slider-thumb { appearance:none; width:7px; height:7px; border-radius:50%; background:#eee; }
input[type=range]::-moz-range-thumb { width:7px; height:7px; border:0; border-radius:50%; background:#eee; }
.times { display:flex; justify-content:space-between; margin-top:9px; color:#777; font-size:10px; font-variant-numeric:tabular-nums; }
footer { display:flex; justify-content:space-between; color:#555; font-size:9px; letter-spacing:.18em; text-transform:uppercase; }
@media (max-width:520px) { main { width:min(340px,100%); padding:38px 0 54px; } #app { padding:22px; } }
</style>

<script>
const audio = document.getElementById('audio');
const play = document.getElementById('play');
const playIcon = document.getElementById('play-icon');
const pauseIcon = document.getElementById('pause-icon');
const seek = document.getElementById('seek');
const current = document.getElementById('current');
const duration = document.getElementById('duration');
const clock = value => { if (!Number.isFinite(value)) return '0:00'; const m=Math.floor(value/60); const s=Math.floor(value%60).toString().padStart(2,'0'); return `${m}:${s}`; };
function updateButton() { const playing=!audio.paused; playIcon.style.display=playing?'none':'block'; pauseIcon.style.display=playing?'block':'none'; play.setAttribute('aria-label',playing?'Pause song':'Play song'); play.title=playing?'Pause':'Play'; }
play.addEventListener('click', async () => { if(audio.paused) { try { await audio.play(); } catch(e) {} } else audio.pause(); updateButton(); });
audio.addEventListener('loadedmetadata',()=>{ duration.textContent=clock(audio.duration); });
audio.addEventListener('timeupdate',()=>{ current.textContent=clock(audio.currentTime); if(Number.isFinite(audio.duration)&&audio.duration>0) seek.value=(audio.currentTime/audio.duration)*100; });
audio.addEventListener('play',updateButton); audio.addEventListener('pause',updateButton); audio.addEventListener('ended',updateButton);
seek.addEventListener('input',()=>{ if(Number.isFinite(audio.duration)) audio.currentTime=(Number(seek.value)/100)*audio.duration; });
</script>
